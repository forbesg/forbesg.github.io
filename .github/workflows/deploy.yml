# The site now lives at forbesgray.co.uk (Cloudflare Pages). GitHub Pages keeps
# serving the old forbesg.github.io address as a forwarding site: on every push
# to main this builds the site, then swaps each page for one that forwards to
# the same path on the new domain (scripts/github-forwarding.mjs).
# Don't set a custom domain on this repo's Pages settings: the wallchart project
# sites under forbesg.github.io must stay where they are.
name: Deploy forwarding site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels a queued (not running) one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # Node 24: Nuxt Content uses Node's built-in SQLite
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Built only to list every page that needs forwarding
      - run: pnpm generate --preset github_pages

      - run: node scripts/github-forwarding.mjs .output/public .output/forwarding https://forbesgray.co.uk

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/forwarding

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
